
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paisalog_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: paisalog_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - paisalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-paisalog} -d $${POSTGRES_DB:-paisalog}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paisalog_postgres_data:
